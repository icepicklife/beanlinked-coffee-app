# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/beanlinked_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Jersey ran as a filter so Spring can serve static/index.html
spring.jersey.type=filter
spring.jersey.init.jersey.config.servlet.filter.forwardOn404=true

# Fake Twilio
faketwilio.url=http://localhost:9997/fake_twilio/send
faketwilio.messaging-service-sid=MGfakeBeanLinked000000000000000000
faketwilio.account-sid=ACfakeBeanLinked000000000000000000
faketwilio.auth-token=fake-auth-token

# Scheduler
beanlinked.scheduler.rate-ms=60000
beanlinked.scheduler.pending-timeout-minutes=30
beanlinked.scheduler.ready-reminder-minutes=15
